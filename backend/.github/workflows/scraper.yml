name: Daily PS Store Scraper

on:
  schedule:
    # Se ejecuta todos los días a las 15:00 UTC (10:00 AM hora de Colombia)
    - cron: '0 15 * * *'
  workflow_dispatch: # Te permite ejecutarlo con un botón manualmente

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install

      - name: Inyectar Credenciales de Firebase
        run: echo "${{ secrets.FIREBASE_CREDENTIALS }}" > serviceAccountKey.json

      - name: Ejecutar Scraper
        run: npm run dev
